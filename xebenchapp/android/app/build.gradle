apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = ["referenceDebug", "experimentalDebug", "geniexDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default RN auto-detects it per host
    //   (linux64-bin / osx-bin / win64-bin) — leave that alone on x86-64 Linux, macOS,
    //   and Windows. ONLY aarch64-Linux hosts need an override: RN's OS detection has
    //   no aarch64 hermesc folder, but the shipped x86-64 hermesc runs fine via
    //   emulation. (JS engine choice does not affect native benchmark numbers.)
    //   Since React Native 0.83 hermesc ships in the hermes-compiler package.
    if (System.getProperty("os.name").toLowerCase().contains("linux")
            && System.getProperty("os.arch") == "aarch64") {
        hermesCommand = "$rootDir/../node_modules/hermes-compiler/hermesc/linux64-bin/hermesc"
    }
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.0.1`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.0.1' // pinned: no dynamic versions

/**
 * Build identity embedded in BuildConfig and recorded in every session (issue #3).
 * Commit and dirty state come from git at configuration time; outside a git checkout
 * both are empty (recorded as unknown). Dirty means tracked or untracked, non-ignored
 * changes; ignored paths (node_modules, build outputs) are covered by the lockfiles.
 * The bundled configuration's hash identifies the default run list in the APK.
 */
def gitOutput = { List<String> args ->
    try {
        def result = providers.exec {
            commandLine(["git"] + args)
            workingDir = rootDir
            ignoreExitValue = true
        }
        return result.result.get().exitValue == 0 ? result.standardOutput.asText.get().trim() : null
    } catch (Exception ignored) {
        return null
    }
}
def xebenchGitCommit = gitOutput(["rev-parse", "--verify", "HEAD"]) ?: ""
def xebenchGitStatus = xebenchGitCommit ? gitOutput(["status", "--porcelain", "--untracked-files=normal"]) : null
def xebenchGitDirty = xebenchGitStatus == null ? "" : (xebenchGitStatus.isEmpty() ? "false" : "true")
def bundledConfig = file("$rootDir/../configs/cpu-reference-v2.json") // must match src/harness/reference.ts
def xebenchBundledConfigSha256 = java.security.MessageDigest.getInstance("SHA-256")
        .digest(bundledConfig.bytes).encodeHex().toString()
// The ExecuTorch runtime version, as declared by the headers of the native libraries that
// react-native-executorch downloads (pinned by xebenchapp/executorch-libs.lock.json); ""
// when they are absent. The experimental flavor's ExecutorchBench module reports it.
def executorchVersionHeader = file("$rootDir/../node_modules/react-native-executorch/third-party/include/executorch/runtime/core/version.h")
def executorchVersionMatch = executorchVersionHeader.exists() ?
        (executorchVersionHeader.text =~ /#define ET_VERSION "([0-9A-Za-z.+-]{1,40})"/) : null
def xebenchExecutorchVersion = executorchVersionMatch != null && executorchVersionMatch.find() ?
        executorchVersionMatch.group(1) : ""

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    packagingOptions {
        jniLibs {
            // QNN libs (user-supplied in experimental, bundled by geniex-android) include
            // Hexagon-DSP ELFs such as libQnnHtpV73Skel.so; arm64 strip would corrupt them.
            // The other QAIRT runtime files geniex-android carries are packaged as shipped too,
            // so check_reference_apk.py --qairt-libs can match every staged file by hash.
            keepDebugSymbols += ["**/libQnn*.so", "**/libCalculator_skel.so", "**/libcalculator.so",
                                 "**/libhta_hexagon_runtime_*.so", "**/libPlatformValidatorShared.so"]
        }
    }

    namespace "com.xebenchapp"
    defaultConfig {
        // Every flavor keeps this id: capture tooling expects it, and the flavors are
        // alternative installs of the same app (installing one replaces another).
        applicationId "com.xebenchapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "XEBENCH_GIT_COMMIT", "\"${xebenchGitCommit}\""
        buildConfigField "String", "XEBENCH_GIT_DIRTY", "\"${xebenchGitDirty}\""
        buildConfigField "String", "XEBENCH_BUNDLED_CONFIG_SHA256", "\"${xebenchBundledConfigSha256}\""
        buildConfigField "String", "XEBENCH_EXECUTORCH_VERSION", "\"${xebenchExecutorchVersion}\""
    }
    buildFeatures {
        buildConfig true
    }

    // Native runtimes that cannot share one APK are separate flavors (issue #3).
    // See README "Build flavors". Proprietary libraries are never in this repo.
    flavorDimensions "runtime"
    productFlavors {
        // llama.rn CPU only: no LiteRT-LM, GENIE-X, QNN, Hexagon/OpenCL or ExecuTorch
        // native runtime. Builds from a clean checkout without vendor SDKs.
        reference {
            dimension "runtime"
            versionNameSuffix "-reference"
        }
        // LiteRT-LM + ExecuTorch (XNNPACK) + llama.rn Hexagon/OpenCL accelerators. LiteRT NPU
        // needs three matched pieces: litertlm-android (below), Google's Qualcomm
        // dispatch lib from Maven (litert-npu-runtime-qualcomm, below), and the QAIRT
        // QNN runtime libs, which are proprietary and staged by
        // scripts/stage_qairt_libs.py into src/experimental/jniLibs/arm64-v8a
        // (git-ignored, never committed). See docs/experiments/litert-accelerators.md.
        experimental {
            dimension "runtime"
            versionNameSuffix "-experimental"
        }
        // GENIE-X (Maven Central) + llama.rn CPU. Its Hexagon runtime conflicts with
        // llama.rn's, so llama.rn accelerators are excluded here. geniex-android 0.8.0 packages
        // the QAIRT 2.45 QNN runtime; scripts/stage_qairt_libs.py --flavor geniex stages the
        // QAIRT 2.50 build of the same files into src/geniex/jniLibs/arm64-v8a (git-ignored),
        // which this flavor packages in their place (pickFirsts below).
        geniex {
            dimension "runtime"
            versionNameSuffix "-geniex"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // The React Native plugin bakes the build host's IP address into every variant for
            // the Metro dev server. Release builds never use it, and a host address in the APK
            // is both private and a source of non-reproducible bytes.
            resValue "string", "react_native_dev_server_ip", "localhost"
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// Every resolved dependency version is locked (gradle.lockfile, committed). After an
// intended dependency change, regenerate it; see README "Build flavors and prerequisites".
dependencyLocking {
    lockAllConfigurations()
    // A configuration without lock state fails instead of resolving unlocked.
    lockMode = LockMode.STRICT
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // LiteRT-LM (Google): no RN binding; driven via src/experimental LiteRtBenchModule.kt.
    // 0.18.0 pairs with litert-npu-runtime-qualcomm 2.3.0 and QAIRT 2.50.0.260828 (the
    // dispatch lib and QAIRT must match the LiteRT-LM release's LITERT_REF; a mismatch
    // logs "Unsupported dispatch runtime version" and engine creation fails).
    experimentalImplementation("com.google.ai.edge.litertlm:litertlm-android:0.18.0")
    // Google-published Qualcomm NPU dispatch (libLiteRtDispatch_Qualcomm.so and
    // libLiteRtCompilerPlugin_Qualcomm.so), Google Maven.
    experimentalImplementation("com.google.ai.edge.litert:litert-npu-runtime-qualcomm:2.3.0")
    // GENIE-X (Qualcomm, Maven Central): no RN binding; driven via src/geniex
    // GenieXBenchModule.kt. Bundles its own llama.cpp+Hexagon runtime, which conflicts
    // with llama.rn's HTP path, hence its own flavor. GenieXNative.java is pinned to this
    // version's JNI calls. Its POM declares no dependencies; the bridge uses none of the
    // SDK's coroutine wrappers.
    geniexImplementation("com.qualcomm.qti:geniex-android:0.8.0")

    // JVM unit tests for pure-Kotlin helpers (e.g. MonitorSchedule); no device needed.
    testImplementation("junit:junit:4.13.2")
}

// Per-flavor native packaging. Autolinking is not flavor-aware, so llama.rn (one AAR
// with CPU and Hexagon/OpenCL variants), react-native-executorch and react-native-worklets
// are linked into every flavor; native runtimes a flavor must not carry are removed from
// its APK here.
// scripts/check_reference_apk.py --flavor <name> verifies the result.
def llamaRnAccelerators = ["**/librnllama*hexagon*.so", "**/librnllama*opencl*.so"]
// aapt-style ignore patterns: llama.rn syncs its HTP libs into src/main/assets/ggml-hexagon.
// A non-empty list replaces AGP's default asset ignores, so they are restated first.
def llamaRnHtpAssets = ["!.svn", "!.git", "!.ds_store", "!*.scc", ".*", "<dir>_*", "!CVS",
                        "!thumbs.db", "!picasa.ini", "!*~", "<dir>ggml-hexagon"]
// react-native-executorch: its JSI library, the ExecuTorch runtime and one library per
// backend (only XNNPACK is downloaded: scripts/check-executorch-libs.js), and
// react-native-worklets, whose runtimes react-native-executorch runs inference on.
def executorchNative = ["**/libexecutorch.so", "**/libRnExecutorch.so",
                        "**/lib*_executorch_backend.so", "**/libworklets.so"]
// ExecuTorch backends other than XNNPACK never ship, even if an install provides one.
def executorchOtherBackends = ["**/libvulkan_executorch_backend.so", "**/libqnn_executorch_backend.so"]
// Defensive: proprietary/vendor runtimes that only belong in experimental or geniex,
// in case someone stages them under src/main/jniLibs.
def vendorNative = ["**/libQnn*.so", "**/libQairt*.so", "**/libSNPE*.so", "**/libGenie*.so",
                    "**/libcdsprpc.so", "**/libLiteRt*.so", "**/liblitertlm*.so"]
// The QNN runtime files geniex-android packages (scripts/stage_qairt_libs.py GENIEX_LIBS).
def geniexQairtRuntime = ["**/libQnn*.so", "**/libCalculator_skel.so", "**/libcalculator.so",
                          "**/libhta_hexagon_runtime_*.so", "**/libPlatformValidatorShared.so"]
// S23 (SM8550): llama.rn's combined hexagon_opencl library hangs at first model load.
// `-Pxebench.excludeLlamaHexagon=true` drops it from experimental so llama.cpp uses CPU.
def excludeLlamaHexagon = (findProperty("xebench.excludeLlamaHexagon") ?: "false").toString() == "true"

// Runtime versions packaged in each variant, as Gradle resolved them for its APK (never
// typed by hand): "" when the variant does not carry the library. BuildInfo and the
// engine bridges report them; session records copy them into runtimeVersions.
def packagedVersion = { variant, String group, String name ->
    project.provider {
        def found = variant.runtimeConfiguration.incoming.resolutionResult.allComponents.find {
            it.moduleVersion != null && it.moduleVersion.group == group && it.moduleVersion.name == name
        }
        found ? found.moduleVersion.version : ""
    }
}
def packagedVersionFields = [
    XEBENCH_LITERTLM_VERSION: ["com.google.ai.edge.litertlm", "litertlm-android"],
    XEBENCH_LITERT_NPU_QUALCOMM_VERSION: ["com.google.ai.edge.litert", "litert-npu-runtime-qualcomm"],
    XEBENCH_GENIEX_VERSION: ["com.qualcomm.qti", "geniex-android"],
]

androidComponents {
    onVariants(selector().all()) { variant ->
        packagedVersionFields.each { field, coordinates ->
            variant.buildConfigFields.put(field, packagedVersion(variant, coordinates[0], coordinates[1]).map {
                new com.android.build.api.variant.BuildConfigField("String", "\"${it}\"",
                    "${coordinates[0]}:${coordinates[1]} as resolved for this variant")
            })
        }
        def jniExcludes = variant.packaging.jniLibs.excludes
        def flavor = variant.flavorName
        if (flavor == "reference") {
            jniExcludes.addAll(llamaRnAccelerators + executorchNative + vendorNative)
            variant.androidResources.ignoreAssetsPatterns.addAll(llamaRnHtpAssets)
        } else if (flavor == "geniex") {
            jniExcludes.addAll(llamaRnAccelerators + executorchNative)
            variant.androidResources.ignoreAssetsPatterns.addAll(llamaRnHtpAssets)
            // QAIRT files staged in src/geniex/jniLibs replace geniex-android's copies (the
            // project's own native libraries come first). Without a staging there is one copy.
            variant.packaging.jniLibs.pickFirsts.addAll(geniexQairtRuntime)
        } else if (flavor == "experimental") {
            jniExcludes.addAll(executorchOtherBackends)
            if (excludeLlamaHexagon) {
                jniExcludes.addAll(llamaRnAccelerators)
                variant.androidResources.ignoreAssetsPatterns.addAll(llamaRnHtpAssets)
            }
        }
    }
}
