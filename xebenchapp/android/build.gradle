buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        // Bumped from RN 0.82's default 2.1.20: LiteRT-LM 0.14.0 AAR ships Kotlin
        // 2.3.0 metadata, unreadable by the 2.1.x compiler. 2.3.x reads both.
        kotlinVersion = "2.3.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    // Lock the build's own plugin classpath too (buildscript-gradle.lockfile).
    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        // Pin the Kotlin compiler to kotlinVersion (2.3.0) so it can READ LiteRT-LM
        // 0.14.0's 2.3.0 metadata. Without the explicit version the compiler stayed
        // at RN 0.82's 2.1.x even after bumping the ext.
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Native code compiled here (the app's codegen libraries, llama.rn's JNI libraries) embeds
// absolute paths in __FILE__ strings and debug info, and the GNU build ID hashes them. Map the
// host-specific roots (checkout, Gradle home, Android SDK) to fixed names, so a user name or
// checkout location never reaches the APK and the bytes do not depend on where it was built.
def xebenchPrefixMaps = [
    "-ffile-prefix-map=${rootDir.parentFile.canonicalPath}=/xebenchapp",
    "-ffile-prefix-map=${gradle.gradleUserHomeDir.canonicalPath}=/gradle-user-home",
]
def androidSdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
if (androidSdkDir) {
    xebenchPrefixMaps += "-ffile-prefix-map=${new File(androidSdkDir).canonicalPath}=/android-sdk"
}
subprojects {
    ["com.android.application", "com.android.library"].each { pluginId ->
        plugins.withId(pluginId) {
            android.defaultConfig.externalNativeBuild.cmake {
                cFlags(*xebenchPrefixMaps)
                cppFlags(*xebenchPrefixMaps)
            }
        }
    }
}
