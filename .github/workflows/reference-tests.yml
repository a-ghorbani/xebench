name: Reference runner tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xebenchapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: xebenchapp/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand
