name: Publication tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate checked-in data against schemas
        run: node scripts/validate_data.mjs
      - name: Canonical data is at contract 1.1 (migration is a no-op)
        run: node scripts/migrate_contract_1_1.mjs --check
      - name: Aggregation fail-closed tests
        run: python3 -m unittest discover -s tests -p 'test_*publication.py' -v
      - name: Contract 1.2 tests
        run: python3 -m unittest discover -s tests -p 'test_contract_1_2.py' -v
      - name: Canonical data is unchanged by the tests (no edits or leftover files)
        run: test -z "$(git status --porcelain -- data/ tests/fixtures/)"
