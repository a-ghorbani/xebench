name: Publication tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate checked-in data against schemas
        run: node scripts/validate_data.mjs
      - name: Aggregation fail-closed tests
        run: python3 -m unittest discover -s tests -p 'test_*publication.py' -v
      - name: Canonical data is unchanged by the tests
        run: git diff --exit-code -- data/
