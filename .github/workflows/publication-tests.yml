name: Publication tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate checked-in data against schemas
        run: node scripts/validate_data.mjs
      - name: Canonical data needs no 1.1 migration (it is at contract 1.1 or later)
        run: node scripts/migrate_contract_1_1.mjs --check
      - name: Every row without versions carries its month
        run: node scripts/date_legacy_rows.mjs --check
      - name: Lab-book gate (board text a visitor reads; docs/STYLE.md)
        run: node scripts/check_public_text.mjs
      - name: Aggregation fail-closed and bundle publication tests
        run: python3 -m unittest discover -s tests -p 'test_*publication.py' -v
      - name: Contract 1.2 tests
        run: python3 -m unittest discover -s tests -p 'test_contract_1_2.py' -v
      - name: Contract 1.3 tests
        run: python3 -m unittest discover -s tests -p 'test_contract_1_3.py' -v
      - name: Publication policy v1 tests
        run: python3 -m unittest discover -s tests -p 'test_publication_policy.py' -v
      - name: Measurement set tests
        run: python3 -m unittest discover -s tests -p 'test_measurement_sets.py' -v
      - name: Lab-book gate tests
        run: python3 -m unittest discover -s tests -p 'test_public_text.py' -v
      - name: Hexagon correction tests
        run: python3 -m unittest discover -s tests -p 'test_hexagon_correction.py' -v
      - name: Canonical data is unchanged by the tests (no edits or leftover files)
        run: test -z "$(git status --porcelain -- data/ tests/fixtures/)"
